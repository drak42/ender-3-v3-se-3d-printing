<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Ender-3 V3 SE calibration order</text>
  <text x="20" y="62" font-size="14" font-weight="bold" fill="#666">PRINTER — once, and after moving or repairs</text>
  <g font-size="14" text-anchor="middle">
    <rect x="20" y="72" width="120" height="46" rx="8" fill="#9a9a9a"/><text x="80" y="92" fill="#fff">Frame check,</text><text x="80" y="110" fill="#fff">belts, wheels</text>
    <rect x="160" y="72" width="110" height="46" rx="8" fill="#9a9a9a"/><text x="215" y="100" fill="#fff">Firmware</text>
    <rect x="290" y="72" width="110" height="46" rx="8" fill="#9a9a9a"/><text x="345" y="100" fill="#fff">E-steps</text>
    <rect x="420" y="72" width="110" height="46" rx="8" fill="#9a9a9a"/><text x="475" y="92" fill="#fff">PID tune</text><text x="475" y="110" fill="#fff">nozzle + bed</text>
    <rect x="550" y="72" width="190" height="46" rx="8" fill="#9a9a9a"/><text x="645" y="92" fill="#fff">Auto level + auto Z,</text><text x="645" y="110" fill="#fff">then first-layer test</text>
  </g>
  <text x="110" y="164" font-size="14" font-weight="bold" fill="#666">EACH FILAMENT — dry it first</text>
  <g font-size="14" text-anchor="middle">
    <rect x="20" y="172" width="120" height="46" rx="8" fill="#e07b39"/><text x="80" y="200" fill="#fff">Temperature</text>
    <rect x="160" y="172" width="100" height="46" rx="8" fill="#e07b39"/><text x="210" y="200" fill="#fff">Flow</text>
    <rect x="280" y="172" width="130" height="46" rx="8" fill="#e07b39" stroke="#555" stroke-dasharray="5 4" opacity="0.55"/><text x="345" y="192" fill="#fff">Linear advance</text><text x="345" y="210" fill="#fff" font-size="12">(custom firmware only)</text>
    <rect x="430" y="172" width="100" height="46" rx="8" fill="#e07b39"/><text x="480" y="200" fill="#fff">Retraction</text>
    <rect x="550" y="172" width="90" height="46" rx="8" fill="#e07b39"/><text x="595" y="192" fill="#fff">Max</text><text x="595" y="210" fill="#fff">flow</text>
    <rect x="660" y="172" width="80" height="46" rx="8" fill="#e07b39"/><text x="700" y="192" fill="#fff">Cooling,</text><text x="700" y="210" fill="#fff">sizes</text>
  </g>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="140" y1="95" x2="156" y2="95"/><line x1="270" y1="95" x2="286" y2="95"/><line x1="400" y1="95" x2="416" y2="95"/><line x1="530" y1="95" x2="546" y2="95"/>
    <path d="M645,118 L645,140 L80,140 L80,168"/>
    <line x1="140" y1="195" x2="156" y2="195"/><line x1="260" y1="195" x2="276" y2="195"/><line x1="410" y1="195" x2="426" y2="195"/><line x1="530" y1="195" x2="546" y2="195"/><line x1="640" y1="195" x2="656" y2="195"/>
  </g>
  <text x="380" y="258" text-anchor="middle" font-size="14" fill="#444">Stock firmware is Marlin with linear advance and input shaping switched off,</text>
  <text x="380" y="278" text-anchor="middle" font-size="14" fill="#444">so pressure-advance tests in the slicer show no change. Skip that step unless you've</text>
  <text x="380" y="298" text-anchor="middle" font-size="14" fill="#444">installed community firmware that enables it.</text>
</svg>
