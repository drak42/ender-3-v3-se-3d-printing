<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Max speed allowed by the flow limit (0.42 mm line)</text>
  <text x="380" y="54" text-anchor="middle" font-size="14" fill="#444">max speed = MVS ÷ (layer height × line width) · typical stock Ender-3 V3 SE values — measure yours</text>
  <g font-size="13">
    <line x1="170" y1="70" x2="170" y2="250" stroke="#999"/>
    <line x1="170" y1="250" x2="710" y2="250" stroke="#999"/>
    <g fill="#666" text-anchor="middle"><text x="170" y="266">0</text><text x="350" y="266">100</text><text x="530" y="266">200</text><text x="710" y="266">300 mm/s</text></g>
    <text x="160" y="96" text-anchor="end">PETG ~8 · 0.20 mm</text><rect x="170" y="84" width="171" height="18" fill="#3a7bd5"/><text x="347" y="98">95</text>
    <text x="160" y="122" text-anchor="end">PETG ~8 · 0.12 mm</text><rect x="170" y="110" width="286" height="18" fill="#3a7bd5" opacity="0.6"/><text x="462" y="124">159</text>
    <text x="160" y="170" text-anchor="end">PLA ~12 · 0.20 mm</text><rect x="170" y="158" width="257" height="18" fill="#e07b39"/><text x="433" y="172">143</text>
    <text x="160" y="196" text-anchor="end">PLA ~12 · 0.12 mm</text><rect x="170" y="184" width="428" height="18" fill="#e07b39" opacity="0.6"/><text x="604" y="198">238</text>
    <rect x="242" y="70" width="36" height="180" fill="#2c7" opacity="0.15"/>
    <text x="260" y="80" text-anchor="middle" fill="#1a7a4a" font-weight="bold" font-size="12">outer wall</text>
    <line x1="620" y1="70" x2="620" y2="250" stroke="#c0392b" stroke-dasharray="4 3"/>
    <text x="625" y="84" fill="#c0392b" font-size="12">250 mm/s</text><text x="625" y="98" fill="#c0392b" font-size="12">printer max</text>
  </g>
  <text x="380" y="292" text-anchor="middle" font-size="14" fill="#444">Green band: 40–60 mm/s quality outer wall. The MVS values are typical, not Creality figures:</text>
  <text x="380" y="312" text-anchor="middle" font-size="14" fill="#444">run the max-flow test for each filament.</text>
</svg>
