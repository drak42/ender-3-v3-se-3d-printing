<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="370" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Calibrating e-steps</text>
<text x="100" y="300" text-anchor="end" font-size="12" fill="#555">extruder</text>
<text x="580" y="300" text-anchor="end" font-size="12" fill="#555">extruder</text>
<line x1="140" y1="50" x2="140" y2="290" stroke="#3a7bd5" stroke-width="6"/>
<rect x="125" y="285" width="30" height="20" fill="#9a9a9a"/>
<line x1="128" y1="65" x2="152" y2="65" stroke="#c0392b" stroke-width="4"/>
<line x1="170" y1="65" x2="170" y2="285" stroke="#555" marker-end="url(#a)"/><line x1="170" y1="285" x2="170" y2="65" stroke="#555" marker-end="url(#a)"/>
<text x="180" y="180" text-anchor="start" font-size="14" fill="#222" font-weight="bold">120 mm</text>
<text x="140" y="330" text-anchor="middle" font-size="13" fill="#222">1. Mark 120 mm above</text>
<text x="140" y="348" text-anchor="middle" font-size="13" fill="#222">the extruder entry</text>
<line x1="620" y1="50" x2="620" y2="290" stroke="#3a7bd5" stroke-width="6"/>
<rect x="605" y="285" width="30" height="20" fill="#9a9a9a"/>
<line x1="608" y1="262" x2="632" y2="262" stroke="#c0392b" stroke-width="4"/>
<line x1="650" y1="262" x2="650" y2="285" stroke="#555"/>
<text x="660" y="278" text-anchor="start" font-size="13" fill="#222">remaining</text>
<text x="620" y="330" text-anchor="middle" font-size="13" fill="#222">2. Extrude 100 mm (M83, G1 E100 F100),</text>
<text x="620" y="348" text-anchor="middle" font-size="13" fill="#222">measure what's left</text>
<text x="380" y="210" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">new e-steps =</text>
<text x="380" y="232" text-anchor="middle" font-size="15" fill="#222">current × 100 ÷ (120 − remaining)</text>
<text x="380" y="262" text-anchor="middle" font-size="13" fill="#555">set with M92 E…, save with M500</text>
</svg>
